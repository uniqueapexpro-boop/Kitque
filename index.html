<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kitque — everything for home, delivered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg:#FBFAF5;
    --bg-alt:#F3F1E8;
    --card:#FFFFFF;
    --ink:#201F19;
    --ink-soft:#6B6F5F;
    --ink-faint:#9A9C8C;
    --line:#E7E4D6;
    --line-soft:#F0EEE3;
    --brand:#1F4B3F;
    --brand-dark:#122E25;
    --brand-tint:#E7F0EA;
    --accent:#E8A33D;
    --accent-dark:#8C5A16;
    --accent-tint:#FBEDD6;
    --danger:#B3432F;
    --danger-tint:#FBE9E4;
    --ok:#2C6B2C;
    --ok-tint:#E1F0E1;
    --radius:18px;
    --radius-sm:12px;
    --radius-xs:8px;
    --shadow-sm:0 1px 2px rgba(24,38,26,.05), 0 1px 1px rgba(24,38,26,.04);
    --shadow-md:0 6px 18px -6px rgba(18,46,37,.16), 0 2px 6px -2px rgba(18,46,37,.08);
    --shadow-lg:0 16px 40px -12px rgba(18,46,37,.24);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  *:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  body{
    background:var(--bg-alt);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:88px;
    box-shadow:0 0 60px rgba(18,46,37,.06);
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-.01em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s var(--ease),background-color .15s,border-color .15s,color .15s,box-shadow .15s;}
  button:active{transform:scale(.97);}
  input,select,textarea{transition:border-color .15s,box-shadow .15s;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:20px 18px 12px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid transparent;
  }
  .brandmark{display:flex;align-items:center;gap:10px;}
  .logo-slot{
    width:160px;height:48px;overflow:hidden;visibility:hidden;flex-shrink:0;
  }
  .logo-slot.has-logo{visibility:visible;}
  .logo-slot img{width:100%;height:100%;object-fit:contain;object-position:left center;display:block;}
  .brandmark span{font-family:'Fraunces',serif;font-size:23px;font-weight:600;color:var(--brand-dark);letter-spacing:-.02em;}
  .logo-slot.has-logo ~ span{display:none;}
  .topbar .sub{font-size:11.5px;color:var(--ink-faint);font-weight:600;letter-spacing:.03em;text-transform:uppercase;}

  /* ---------- views ---------- */
  .view{padding:0 18px 24px;display:none;}
  .view.active{display:block;animation:viewIn .28s var(--ease);}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .section-title{font-size:23px;margin:8px 0 16px;letter-spacing:-.015em;}

  /* ---------- search & filters ---------- */
  .searchbar{
    display:flex;align-items:center;gap:9px;
    background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:12px 16px;margin-bottom:14px;
    box-shadow:var(--shadow-sm);
  }
  .searchbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint);}
  .searchbar input{
    border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--ink);font-weight:500;
  }
  .searchbar input::placeholder{color:var(--ink-faint);}
  .searchbar svg{flex-shrink:0;opacity:.5;color:var(--ink-soft);}
  .filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:12.5px;font-weight:700;color:var(--ink-soft);
    white-space:nowrap;
  }
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 3px 10px -2px rgba(18,46,37,.35);}
  .filter-panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:16px;margin-bottom:18px;display:none;box-shadow:var(--shadow-sm);
  }
  .filter-panel.open{display:block;}
  .filter-panel label{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .filter-panel input[type=range]{width:100%;accent-color:var(--brand);}
  .filter-row{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--ink-soft);}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  .pcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);
    transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s;
  }
  .pcard:active{transform:translateY(1px) scale(.99);box-shadow:none;}
  .pcard .thumb{
    width:100%;aspect-ratio:1/1;background:var(--brand-tint);
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
  }
  .pcard .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease);}
  .pcard .best{
    position:absolute;top:9px;left:9px;background:var(--accent);color:#fff;
    font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;
    box-shadow:0 2px 6px rgba(140,90,22,.35);
  }
  .pcard .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .pcard .title{font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pcard .price{font-size:15px;font-weight:700;color:var(--brand-dark);margin-top:auto;}

  .empty{
    text-align:center;padding:64px 20px;color:var(--ink-soft);
  }
  .empty .glyph{font-size:40px;margin-bottom:12px;opacity:.85;}
  .empty h3{color:var(--ink);margin-bottom:7px;font-size:18px;}
  .empty p{font-size:13.5px;line-height:1.6;margin:0;color:var(--ink-soft);}

  /* ---------- categories ---------- */
  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  .catcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 16px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;
    box-shadow:var(--shadow-sm);
  }
  .catcard:active{transform:scale(.98);}
  .catcard .icon{font-size:28px;}
  .catcard .name{font-weight:700;font-size:14px;}
  .catcard .count{font-size:11.5px;color:var(--ink-faint);font-weight:600;}

  /* ---------- product view ---------- */
  .back-row{display:flex;align-items:center;gap:8px;padding:16px 18px 0;}
  .back-btn{
    border:1px solid var(--line);background:var(--card);border-radius:11px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);
  }
  .pv-image{width:100%;aspect-ratio:1/1;border-radius:var(--radius);background:var(--brand-tint);overflow:hidden;margin-bottom:16px;}
  .pv-image img{width:100%;height:100%;object-fit:cover;}

  /* ---------- product image gallery / slider ---------- */
  .pv-gallery{position:relative;margin-bottom:14px;}
  .pv-slider{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    border-radius:var(--radius);background:var(--brand-tint);
    scrollbar-width:none;box-shadow:var(--shadow-sm);
  }
  .pv-slider::-webkit-scrollbar{display:none;}
  .pv-slider .slide{
    flex:0 0 100%;aspect-ratio:1/1;scroll-snap-align:center;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .pv-slider .slide img{width:100%;height:100%;object-fit:cover;}
  .pv-dots{display:flex;justify-content:center;gap:6px;margin-top:11px;}
  .pv-dots .dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .25s var(--ease);}
  .pv-dots .dot.active{width:18px;border-radius:4px;background:var(--brand);}
  .pv-counter{
    position:absolute;top:11px;right:11px;background:rgba(18,46,37,.68);color:#fff;
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;backdrop-filter:blur(2px);
  }

  .pv-title{font-size:23px;margin-bottom:5px;letter-spacing:-.015em;line-height:1.25;}
  .pv-price{font-size:20px;font-weight:700;color:var(--brand-dark);margin-bottom:14px;}
  .pv-desc{font-size:14px;line-height:1.65;color:var(--ink-soft);margin-bottom:18px;}
  .pv-meta{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tag{background:var(--brand-tint);color:var(--brand-dark);font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;}

  /* ---------- sticky product action bar ---------- */
  .pv-actionbar{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(65px + env(safe-area-inset-bottom));
    width:100%;max-width:480px;
    display:flex;gap:10px;align-items:center;
    padding:12px 18px;background:linear-gradient(to top,var(--bg) 55%,rgba(251,250,245,0));
    z-index:25;
  }
  .share-btn{
    width:50px;height:50px;flex-shrink:0;border-radius:var(--radius-sm);
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);color:var(--brand-dark);
  }
  .pv-actionbar .btn{width:auto;flex:1;box-shadow:var(--shadow-lg);}
  .pv-spacer{height:70px;}

  /* ---------- modal / popup ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(18,25,20,.55);z-index:60;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s var(--ease);
    backdrop-filter:blur(2px);
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-sheet{
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    background:var(--bg);border-radius:22px 22px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(24px);transition:transform .28s var(--ease);box-shadow:0 -12px 40px rgba(18,25,20,.25);
  }
  .modal-overlay.open .modal-sheet{transform:translateY(0);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{font-size:18px;}
  .modal-close{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;
  }

  .btn{
    width:100%;padding:15px;border-radius:var(--radius-sm);border:none;
    font-size:15px;font-weight:700;text-align:center;
  }
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px -3px rgba(18,46,37,.4);}
  .btn-primary:active{background:var(--brand-dark);}
  .btn-ghost{background:var(--card);color:var(--brand-dark);border:1px solid var(--line);}
  .btn-ghost:active{background:var(--brand-tint);}
  .btn-danger{background:var(--danger-tint);color:var(--danger);border:1px solid #EBC6BB;}
  .btn-google{
    background:#fff;color:#3C4043;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .btn-google:active{background:#F7F7F5;}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-faint);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- form ---------- */
  .form-wrap{margin-top:20px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
    font-size:14px;background:var(--card);color:var(--ink);font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-tint);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .cod-note{
    display:flex;gap:9px;align-items:center;background:var(--accent-tint);color:var(--accent-dark);
    padding:11px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;margin-bottom:15px;
  }
  .errline{color:var(--danger);font-size:12.5px;margin:-4px 0 10px;font-weight:600;}

  /* ---------- order card ---------- */
  .ordercard{
    background:var(--card);border:1.5px dashed var(--brand);border-radius:var(--radius);
    padding:22px;margin-top:10px;
  }
  .ordercard .ok{display:flex;align-items:center;gap:8px;color:var(--brand-dark);font-weight:700;margin-bottom:14px;font-size:15px;}
  .ordercard .code{
    background:var(--brand-tint);color:var(--brand-dark);font-family:'Fraunces',serif;
    font-size:20px;font-weight:600;text-align:center;padding:13px;border-radius:11px;margin-bottom:15px;letter-spacing:.03em;
  }
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .kv span:first-child{color:var(--ink-soft);font-weight:600;}
  .kv span:last-child{font-weight:700;text-align:right;max-width:60%;}
  .track-note{
    margin-top:17px;background:var(--accent-tint);border-radius:var(--radius-sm);padding:13px 15px;font-size:12.5px;color:var(--accent-dark);line-height:1.55;
  }

  /* ---------- my orders ---------- */
  .lookup-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .lookup-box h3{font-size:14.5px;margin-bottom:11px;}
  .ordertile{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow-sm);
  }
  .ordertile .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;}
  .ordertile .code{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .status{font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .status.Confirmed{background:var(--brand-tint);color:var(--brand-dark);}
  .status.Shipped{background:var(--accent-tint);color:var(--accent-dark);}
  .status.Delivered{background:var(--ok-tint);color:var(--ok);}
  .status.Cancelled{background:var(--danger-tint);color:var(--danger);}
  .ordertile .pname{font-size:13.5px;margin-bottom:5px;font-weight:600;}
  .ordertile .meta{font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .ordertile .cancel-row{margin-top:11px;}
  .ordertile .cancel-row button{
    width:auto;padding:8px 14px;font-size:12.5px;
  }

  /* ---------- profile ---------- */
  .authcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);}
  .authtabs{display:flex;background:var(--brand-tint);border-radius:999px;padding:4px;margin-bottom:18px;}
  .authtabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--brand-dark);}
  .authtabs button.active{background:var(--brand);color:#fff;}
  .profile-head{display:flex;align-items:center;gap:13px;margin-bottom:20px;}
  .avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(155deg,var(--brand),var(--brand-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:21px;font-weight:600;box-shadow:0 3px 10px rgba(18,46,37,.3);}
  .profile-head .pname{font-size:16.5px;font-weight:700;}
  .profile-head .pmob{font-size:12.5px;color:var(--ink-faint);margin-top:1px;}
  .stat-row{display:flex;gap:10px;margin-bottom:20px;}
  .stat{flex:1;background:var(--brand-tint);border-radius:var(--radius-sm);padding:13px;text-align:center;}
  .stat .n{font-family:'Fraunces',serif;font-size:23px;font-weight:600;color:var(--brand-dark);}
  .stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:var(--card);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;
    padding:9px 4px calc(9px + env(safe-area-inset-bottom));
    z-index:30;box-shadow:0 -2px 16px rgba(18,46,37,.06);
  }
  .navitem{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;border:none;color:var(--ink-faint);font-size:10.5px;font-weight:700;
    padding:5px 8px;border-radius:11px;position:relative;
  }
  .navitem svg{stroke:var(--ink-faint);transition:stroke .15s;}
  .navitem.active{color:var(--brand-dark);}
  .navitem.active svg{stroke:var(--brand-dark);}
  .navitem.active::before{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:16px;height:3px;border-radius:0 0 4px 4px;background:var(--brand);
  }

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;
    max-width:400px;text-align:center;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;}

  .config-banner{
    background:var(--danger-tint);color:var(--danger);font-size:12px;padding:11px 15px;
    border-radius:var(--radius-sm);margin:14px 18px 0;line-height:1.55;font-weight:600;
  }

  /* ---------- price (actual + cut price) ---------- */
  .price-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:11px;}
  .price-now{font-size:27px;font-weight:800;color:var(--accent-dark);letter-spacing:-.01em;}
  .price-mrp{font-size:15px;color:var(--ink-faint);text-decoration:line-through;font-weight:600;}
  .price-off{font-size:11.5px;font-weight:800;color:var(--ok);background:var(--ok-tint);padding:3px 9px;border-radius:999px;}
  .pcard .price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .pcard .price span:first-child{font-size:17px;font-weight:800;color:var(--accent-dark);}
  .pcard .price-mrp-sm{font-size:11px;color:var(--ink-faint);text-decoration:line-through;font-weight:600;}

  /* ---------- quantity stepper ---------- */
  .qty-stepper{display:flex;align-items:center;gap:14px;margin:2px 0 16px;}
  .qty-stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:var(--shadow-sm);}
  .qty-stepper .qn{font-size:16px;font-weight:700;min-width:24px;text-align:center;}
  .qty-stepper .lbl{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .total-row{font-size:14px;font-weight:800;color:var(--brand-dark);margin-left:auto;}

  /* ---------- size selector ---------- */
  .size-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:9px;}
  .size-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .size-chip{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--ink);}
  .size-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 10px -2px rgba(18,46,37,.35);}

  @media print{
    body *{visibility:hidden;}
    #printarea,#printarea *{visibility:visible;}
    #printarea{display:block !important;position:absolute;top:0;left:0;width:100%;padding:24px;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brandmark">

/* ---------------- REST helpers (no external libraries) ---------------- */
let session = null; // { access_token, user }

function authHeaders(){
  const h = { "apikey": SUPABASE_ANON_KEY, "Content-Type":"application/json" };
  h["Authorization"] = "Bearer " + (session ? session.access_token : SUPABASE_ANON_KEY);
  return h;
}

async function pgFetch(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { ...authHeaders(), ...(opts.headers||{}) }
  });
  if(!res.ok){ const t = await res.text(); throw new Error(t || res.statusText); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function rpcFetch(fn, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST", headers: authHeaders(), body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text(); throw new Error(t || res.statusText); }
  return res.json();
}

async function authFetch(path, body){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method:"POST",
    headers:{ "apikey": SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || data.error || "Something went wrong");
  return data;
}

/* ---------------- toast ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- navigation ---------------- */
const tabs = ["products","orders","category","productview","profile"];
function showTab(tab){
  tabs.forEach(t=>{
    document.getElementById('view-'+t).classList.toggle('active', t===tab);
  });
  document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const subs = {products:"everything for home", orders:"track & manage", category:"browse by room", productview:"", profile:"your account"};
  document.getElementById('topbarSub').textContent = subs[tab] || "";
  if(tab==="orders") renderOrdersTab();
  if(tab==="profile") renderProfileTab();
  if(tab==="category") renderCategoryTab();
  document.getElementById('pvActionBar').style.display = (tab==="productview" && currentProduct) ? 'flex' : 'none';
  window.scrollTo(0,0);
}
document.querySelectorAll('.navitem').forEach(b=>{
  b.addEventListener('click', ()=>showTab(b.dataset.tab));
});

});

/* ---------------- state ---------------- */
let allProducts = [];
let allCategories = [];
let activeFilter = "all";
let searchTerm = "";
let currentProduct = null;
let selectedQty = 1;
let selectedSize = null;
let profile = null; // { id, name, mobile, email, role } for the signed-in user
let editingProductId = null;

/* ---------------- site branding ---------------- */
async function loadSiteLogo(){
  // No logo/branding graphic shows by default — a 16:4 slot is reserved
  // in the header and only becomes visible once an admin sets a
  // `logo_url` in the `site_settings` table (id=1).
  if(!isConfigured) return;
  try{
    const rows = await pgFetch("site_settings?select=logo_url&id=eq.1");
    const logoUrl = rows && rows[0] && rows[0].logo_url;
    if(logoUrl){
      const slot = document.getElementById('brandMark');
      slot.innerHTML = `<img src="${escapeHtml(logoUrl)}" alt="Kitque logo">`;
      slot.classList.add('has-logo');
    }
  }catch(e){ /* site_settings table not created yet — slot stays empty */ }
}

/* ---------------- shared-link deep open ---------------- */
function openSharedProductFromUrl(){
  const id = new URLSearchParams(window.location.search).get('product');
  if(id) openProduct(id);
}

/* ---------------- data loading ---------------- */
async function loadCategories(){
  if(!isConfigured) return;
  try{
    allCategories = await pgFetch("categories?select=*&order=name.asc");
  }catch(e){ console.error(e); allCategories = []; }
}

async function loadProducts(){
  if(!isConfigured) return;
  try{
    allProducts = await pgFetch("products?select=*&order=created_at.desc");
  }catch(e){ console.error(e); allProducts = []; }
  renderProductGrid();
}

/* ---------------- product grid + filters ---------------- */
function matchesFilter(p){
  if(activeFilter==="bestseller") return !!p.is_bestseller;
  if(activeFilter==="under500") return p.price < 500;
  if(activeFilter==="500to2000") return p.price >= 500 && p.price <= 2000;
  if(activeFilter==="over2000") return p.price > 2000;
  return true;
}

function renderProductGrid(){
  const grid = document.getElementById('productGrid');
  let items = allProducts.filter(matchesFilter);
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    items = items.filter(p => p.title.toLowerCase().includes(q) || (p.description||"").toLowerCase().includes(q));
  }
  if(!isConfigured){
    grid.innerHTML = "";
    return;
  }
  if(items.length===0){
    grid.innerHTML = "";
    grid.parentElement.querySelectorAll('.empty').forEach(e=>e.remove());
    const empty = document.createElement('div');
    empty.className = "empty";
    empty.innerHTML = allProducts.length===0
      ? `<div class="glyph">🏡</div><h3>No products yet</h3><p>Kitque is warming up — check back once sellers start adding products.</p>`
      : `<div class="glyph">🔍</div><h3>Nothing matches</h3><p>Try a different search term or filter.</p>`;
    grid.after(empty);
    return;
  }
  document.querySelectorAll('#view-products .empty').forEach(e=>e.remove());
  grid.innerHTML = items.map(productCardHtml).join('');
}

document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value; renderProductGrid();
});
document.querySelectorAll('.filters .chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.filters .chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    renderProductGrid();
  });
});

function productCardHtml(p){
  const off = p.mrp && p.mrp>p.price ? Math.round((1-p.price/p.mrp)*100) : 0;
  return `
    <div class="pcard" onclick="openProduct('${p.id}')">
      <div class="thumb">
        ${p.is_bestseller ? '<div class="best">Best seller</div>' : ''}
        ${productImages(p)[0] ? `<img src="${escapeHtml(productImages(p)[0])}" alt="">` : `<span style="font-size:30px;">🏠</span>`}
      </div>
      <div class="body">
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="price">
          <span>₹${Number(p.price).toLocaleString('en-IN')}</span>
          ${off>0 ? `<span class="price-mrp-sm">₹${Number(p.mrp).toLocaleString('en-IN')}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- categories tab ---------------- */
function renderCategoryTab(){
  const wrap = document.getElementById('catGrid');
  if(!isConfigured){ wrap.innerHTML = ""; return; }
  const withCounts = allCategories.map(c=>{
    const count = allProducts.filter(p=>p.category_id===c.id).length;
    return {...c, count};
  }).filter(c=>c.count>0);

  if(withCounts.length===0){
    wrap.innerHTML = "";
    const empty = document.createElement('div');
    empty.className = "empty";
    empty.innerHTML = `<div class="glyph">📦</div><h3>No categories live yet</h3><p>Categories appear here as soon as they have products in them.</p>`;
    wrap.after(empty);
    return;
  }
  document.querySelectorAll('#view-category .empty').forEach(e=>e.remove());
  wrap.innerHTML = withCounts.map(c=>`
    <div class="catcard" onclick="openCategory('${c.id}')">
      <div class="icon">${c.icon||'🏷️'}</div>
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="count">${c.count} product${c.count>1?'s':''}</div>
    </div>
  `).join('');
}
function openCategory(id){
  activeFilter = "all"; searchTerm="";
  document.getElementById('searchInput').value = "";
  document.querySelectorAll('.filters .chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('.filters .chip[data-filter="all"]').classList.add('active');
  const items = allProducts.filter(p=>p.category_id===id);
  showTab('products');
  const grid = document.getElementById('productGrid');
  document.querySelectorAll('#view-products .empty').forEach(e=>e.remove());
  if(items.length===0){ renderProductGrid(); return; }
  grid.innerHTML = items.map(productCardHtml).join('');
}

/* ---------------- product view ---------------- */
function openProduct(id){
  currentProduct = allProducts.find(p=>p.id===id);
  if(!currentProduct) return;
  renderProductView();
  showTab('productview');
}

function productImages(p){
  // Supports a seller-supplied `images` array (4-5 photos) with graceful
  // fallback to the legacy single `image_url` column.
  if(Array.isArray(p.images) && p.images.length) return p.images;
  if(p.image_url) return [p.image_url];
  return [];
}

function renderProductView(){
  const p = currentProduct;
  const pv = document.getElementById('pvContent');
  if(!p){ pv.innerHTML = `<div class="empty"><div class="glyph">🛒</div><h3>No product selected</h3><p>Pick a product from All Products to see it here.</p></div>`; return; }
  selectedQty = 1;
  selectedSize = null;
  const images = productImages(p);
  const gallery = images.length ? `
    <div class="pv-gallery">
      <div class="pv-slider" id="pvSlider">
        ${images.map(src=>`<div class="slide"><img src="${escapeHtml(src)}" alt="${escapeHtml(p.title)}"></div>`).join('')}
      </div>
      ${images.length>1 ? `<div class="pv-counter" id="pvCounter">1/${images.length}</div>` : ''}
      ${images.length>1 ? `<div class="pv-dots" id="pvDots">${images.map((_,i)=>`<div class="dot${i===0?' active':''}"></div>`).join('')}</div>` : ''}
    </div>
  ` : `<div class="pv-image"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px;">🏠</div></div>`;

  const mrp = Number(p.mrp)||0, price = Number(p.price)||0;
  const off = mrp>price ? Math.round((1-price/mrp)*100) : 0;
  const sizes = Array.isArray(p.sizes) ? p.sizes : [];

  pv.innerHTML = `
    ${gallery}
    <h1 class="pv-title">${escapeHtml(p.title)}</h1>
    <div class="price-row">
      <span class="price-now">₹${price.toLocaleString('en-IN')}</span>
      ${off>0 ? `<span class="price-mrp">₹${mrp.toLocaleString('en-IN')}</span><span class="price-off">${off}% off</span>` : ''}
    </div>
    <div class="pv-meta">
      ${p.is_bestseller ? '<div class="tag">⭐ Best seller</div>' : ''}
      <div class="tag">${p.stock>0 ? 'In stock' : 'Made to order'}</div>
    </div>
    ${p.has_sizes && sizes.length ? `
      <div class="size-label">Select size</div>
      <div class="size-row" id="sizeRow">
        ${sizes.map(s=>`<button type="button" class="size-chip" data-size="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
      </div>
    ` : ''}
    <div class="qty-stepper">
      <span class="lbl">Quantity</span>
      <button type="button" id="qtyMinus">−</button>
      <div class="qn" id="qtyVal">1</div>
      <button type="button" id="qtyPlus">+</button>
      <div class="total-row" id="pvTotal"></div>
    </div>
    <div class="pv-desc">${escapeHtml(p.description || "No description provided for this product yet.")}</div>
    <div class="pv-spacer"></div>
  `;

  if(images.length>1) initGallery(images.length);

  const qtyMinus=document.getElementById('qtyMinus'), qtyPlus=document.getElementById('qtyPlus'), qtyVal=document.getElementById('qtyVal');
  qtyMinus.addEventListener('click', ()=>{
    if(selectedQty>1){ selectedQty--; qtyVal.textContent=selectedQty; updateTotalDisplay(); }
  });
  qtyPlus.addEventListener('click', ()=>{
    const max = p.stock>0 ? p.stock : 99;
    if(selectedQty<max){ selectedQty++; qtyVal.textContent=selectedQty; updateTotalDisplay(); }
    else toast("That's all the stock we have right now.");
  });
  const sizeRow = document.getElementById('sizeRow');
  if(sizeRow){
    sizeRow.querySelectorAll('.size-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        sizeRow.querySelectorAll('.size-chip').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        selectedSize = btn.dataset.size;
      });
    });
  }
  updateTotalDisplay();
}

function updateTotalDisplay(){
  const p = currentProduct;
  if(!p) return;
  const el = document.getElementById('pvTotal');
  if(el) el.textContent = `Total: ₹${(Number(p.price)*selectedQty).toLocaleString('en-IN')}`;
}

function initGallery(count){
  const slider = document.getElementById('pvSlider');
  if(!slider) return;
  slider.addEventListener('scroll', ()=>{
    const idx = Math.round(slider.scrollLeft / slider.clientWidth);
    document.querySelectorAll('#pvDots .dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
    const counter = document.getElementById('pvCounter');
    if(counter) counter.textContent = `${idx+1}/${count}`;
  }, {passive:true});
}

function genOrderCode(){
  return "KTQ-" + Math.floor(10000 + Math.random()*89999);
}

async function placeOrder(){
  const btn = document.getElementById('placeOrderBtn');
  const name = document.getElementById('f_name').value.trim();
  const mobile = document.getElementById('f_mobile').value.trim();
  const email = document.getElementById('f_email').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const state = document.getElementById('f_state').value.trim();
  const district = document.getElementById('f_district').value.trim();
  const village = document.getElementById('f_village').value.trim();
  const errEl = document.getElementById('formError');

  if(!name || !mobile || !address || !state || !district || !village || !/^\d{10}$/.test(mobile)){
    errEl.style.display='block';
    errEl.textContent = !/^\d{10}$/.test(mobile) && mobile ? "Enter a valid 10-digit mobile number." : "Please fill in every required field.";
    return;
  }
  errEl.style.display='none';

  const days = 5 + Math.floor(Math.random()*6); // 5-10 days
  const expected = new Date(); expected.setDate(expected.getDate()+days);
  const order = {
    order_code: genOrderCode(),
    product_id: currentProduct.id,
    product_title: currentProduct.title,
    price: currentProduct.price,
    quantity: selectedQty,
    size: currentProduct.has_sizes ? selectedSize : null,
    total_price: Number(currentProduct.price) * selectedQty,
    buyer_name: name, mobile, email: email || null,
    address, state, district, village,
    status: "Confirmed",
    expected_delivery: expected.toISOString().slice(0,10),
    user_id: session ? session.user.id : null
  };

  btn.disabled = true; btn.textContent = "Placing order…";

  try{
    // Not using the insert response here: guests (user_id = null) can't
    // pass the orders table's own SELECT policy (auth.uid() = user_id),
    // so return=representation comes back empty for them even though the
    // insert succeeded. Everything the confirmation card needs is already
    // in `order`, so render straight from that.
    await pgFetch("orders", {
      method:"POST",
      headers:{ "Prefer":"return=minimal" },
      body: JSON.stringify(order)
    });
    document.getElementById('orderModalTitle').textContent = "Order confirmed";
    renderOrderCard(order, document.getElementById('orderModalBody'));
    toast("Order placed! Cash on delivery.");
  }catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = "Place order";
    // Surface the real backend error (e.g. an RLS policy or a check
    // constraint rejecting the row) instead of a generic message, so
    // it's actually possible to diagnose from the Supabase side.
    errEl.style.display = 'block';
    errEl.textContent = "Couldn't place the order: " + e.message;
  }
}

function renderOrderCard(o, targetEl){
  const wrap = targetEl || document.getElementById('orderModalBody');
  wrap.innerHTML = `
    <div class="ordercard" id="orderCardPrintable">
      <div class="ok">✅ Order confirmed</div>
      <div class="code">${o.order_code}</div>
      <div class="kv"><span>Product</span><span>${escapeHtml(o.product_title)}</span></div>
      ${o.size ? `<div class="kv"><span>Size</span><span>${escapeHtml(o.size)}</span></div>` : ''}
      <div class="kv"><span>Quantity</span><span>${o.quantity||1}</span></div>
      <div class="kv"><span>Total amount</span><span>₹${Number(o.total_price||o.price).toLocaleString('en-IN')}</span></div>
      <div class="kv"><span>Name</span><span>${escapeHtml(o.buyer_name)}</span></div>
      <div class="kv"><span>Mobile</span><span>${escapeHtml(o.mobile)}</span></div>
      <div class="kv"><span>Address</span><span>${escapeHtml(o.address)}, ${escapeHtml(o.village)}, ${escapeHtml(o.district)}, ${escapeHtml(o.state)}</span></div>
      <div class="kv"><span>Payment</span><span>Cash on delivery</span></div>
      <div class="kv"><span>Expected delivery</span><span>${o.expected_delivery}</span></div>
      <button class="btn btn-ghost" style="margin-top:14px;" onclick="downloadOrderCard('${o.order_code}')">Download order card (PDF)</button>
      ${!session ? `<div class="track-note">📍 Want to track this order later? <a href="#" onclick="showTab('profile');return false;" style="color:var(--accent-dark);font-weight:700;">Sign up</a> so it's saved to your account — or track anytime with your mobile number and order ID under My Orders.</div>` : ''}
      <button class="btn btn-primary" style="margin-top:12px;" onclick="closeOrderModal()">Done</button>
    </div>
  `;
}

function downloadOrderCard(code){
  const card = document.getElementById('orderCardPrintable');
  if(!card){ toast("Nothing to download yet."); return; }

  const fallbackPrint = ()=>{
    document.getElementById('printarea').innerHTML = card.outerHTML;
    window.print();
  };

  if(!window.html2pdf){ fallbackPrint(); return; }

  // Capture the card that's actually on screen (so fonts/CSS are already
  // rendered) — just hide the action buttons for a moment so they don't
  // appear in the PDF.
  const buttons = card.querySelectorAll('button');
  const prevDisplay = [];
  buttons.forEach(b=>{ prevDisplay.push(b.style.display); b.style.display = 'none'; });

  const opt = {
    margin: 10,
    filename: `${code}-kitque-order.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: document.documentElement.scrollWidth },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(card).save()
    .then(()=>{
      buttons.forEach((b,i)=>{ b.style.display = prevDisplay[i]; });
    })
    .catch(err=>{
      console.error(err);
      buttons.forEach((b,i)=>{ b.style.display = prevDisplay[i]; });
      toast("Couldn't generate the PDF file — opening print instead.");
      fallbackPrint();
    });
}

/* ---------------- my orders tab ---------------- */
let myOrders = [];

async function renderOrdersTab(){
  const wrap = document.getElementById('ordersContent');
  if(!isConfigured){ wrap.innerHTML = ""; return; }

  if(session){
    try{
      myOrders = await pgFetch(`orders?select=*&user_id=eq.${session.user.id}&order=created_at.desc`);
    }catch(e){ myOrders = []; }
    wrap.innerHTML = renderOrderList(myOrders, true);
    attachCancelHandlers();
    return;
  }

  wrap.innerHTML = `
    <div class="lookup-box">
      <h3>Track a guest order</h3>
      <div class="field"><label>Order ID</label><input id="lk_code" placeholder="KTQ-XXXXX"></div>
      <div class="field"><label>Mobile number used at checkout</label><input id="lk_mobile" placeholder="10-digit number" inputmode="numeric"></div>
      <button class="btn btn-primary" id="lookupBtn">Find my order</button>
      <div style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:12px;">or <a href="#" onclick="showTab('profile');return false;" style="color:var(--brand-dark);font-weight:700;">sign up</a> to see every order automatically</div>
    </div>
    <div id="lookupResult"></div>
  `;
  document.getElementById('lookupBtn').addEventListener('click', async ()=>{
    const code = document.getElementById('lk_code').value.trim();
    const mobile = document.getElementById('lk_mobile').value.trim();
    if(!code || !mobile){ toast("Enter both order ID and mobile number."); return; }
    try{
      const rows = await rpcFetch("get_order_by_code", {p_order_code: code, p_mobile: mobile});
      const resultEl = document.getElementById('lookupResult');
      if(!rows || rows.length===0){
        resultEl.innerHTML = `<div class="empty"><div class="glyph">🔎</div><h3>No order found</h3><p>Double-check the order ID and mobile number.</p></div>`;
        return;
      }
      myOrders = rows;
      resultEl.innerHTML = renderOrderList(rows, true);
      attachCancelHandlers();
    }catch(e){ console.error(e); toast("Something went wrong. Try again."); }
  });
}

function renderOrderList(orders, cancellable){
  if(!orders || orders.length===0){
    return `<div class="empty"><div class="glyph">📭</div><h3>No orders yet</h3><p>Orders you place will show up here.</p></div>`;
  }
  return orders.map(o=>{
    const placed = new Date(o.created_at);
    const withinWindow = (Date.now() - placed.getTime()) < 3*24*60*60*1000;
    const canCancel = cancellable && o.status !== "Cancelled" && o.status !== "Delivered" && withinWindow;
    return `
    <div class="ordertile">
      <div class="top">
        <div><div class="code">${o.order_code}</div><div class="meta">Placed ${placed.toLocaleDateString()}</div></div>
        <div class="status ${o.status}">${o.status}</div>
      </div>
      <div class="pname">${escapeHtml(o.product_title)}${o.size?` · Size ${escapeHtml(o.size)}`:''}${o.quantity>1?` · Qty ${o.quantity}`:''} · ₹${Number(o.total_price||o.price).toLocaleString('en-IN')}</div>
      <div class="meta">Expected delivery: ${o.expected_delivery || '—'}</div>
      ${canCancel ? `<div class="cancel-row"><button class="btn btn-danger" data-code="${o.order_code}" data-mobile="${o.mobile}">Cancel order</button></div>` : ''}
      ${!canCancel && o.status!=="Cancelled" && o.status!=="Delivered" ? `<div class="meta" style="margin-top:8px;">Cancellation window closed (orders can only be cancelled within 3 days of placing).</div>` : ''}
    </div>`;
  }).join('');
}

function attachCancelHandlers(){
  document.querySelectorAll('.cancel-row button').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const code = btn.dataset.code, mobile = btn.dataset.mobile;
      try{
        const result = await rpcFetch("cancel_order", {p_order_code: code, p_mobile: mobile});
        if(result === "cancelled"){ toast("Order cancelled."); renderOrdersTab(); }
        else if(result === "window_closed"){ toast("Too late — this order is past the 3-day cancellation window."); }
        else if(result === "already_cancelled"){ toast("This order is already cancelled."); }
        else { toast("Order not found."); }
      }catch(e){ console.error(e); toast("Couldn't cancel right now. Try again."); }
    });
  });
}

/* ---------------- profile / auth ---------------- */
function renderProfileTab(){
  const wrap = document.getElementById('profileContent');
  if(!isConfigured){ wrap.innerHTML = ""; return; }
  if(session){
    const email = session.user.email || "";
    const initials = (email[0]||"H").toUpperCase();
    wrap.innerHTML = `
      <div class="authcard">
        <div class="profile-head">
          <div class="avatar">${initials}</div>
          <div><div class="pname">${escapeHtml(email)}</div><div class="pmob">Signed in to Kitque</div></div>
        </div>
        <div class="stat-row">
          <div class="stat"><div class="n">${myOrders.length}</div><div class="l">Total orders</div></div>
          <div class="stat"><div class="n">${myOrders.filter(o=>o.status==="Delivered").length}</div><div class="l">Delivered</div></div>
        </div>
        <button class="btn btn-ghost" id="logoutBtn">Log out</button>
      </div>
    `;
    document.getElementById('logoutBtn').addEventListener('click', ()=>{
      session = null; profile = null; toast("Logged out."); renderProfileTab();
    });
  } else {
    wrap.innerHTML = `
      <div class="authcard">
        <h3 style="font-size:16px;margin-bottom:14px;">Log in or sign up</h3>
        <div id="authFormWrap"></div>
      </div>
    `;
    switchAuthTab('login');
  }
}

let authTab = "login"; // "login" | "signup"

function switchAuthTab(which){
  authTab = which;
  renderAuthStage();
}

function renderAuthStage(){
  const wrap = document.getElementById('authFormWrap');
  if(authTab === "login"){
    wrap.innerHTML = `
      <button class="btn btn-google" id="googleLoginBtn" type="button">${googleIconSvg()} Continue with Google</button>
      <div class="auth-divider">or</div>
      <div class="field"><label>Email</label><input id="a_email" placeholder="you@email.com"></div>
      <div class="field"><label>Password</label><input id="a_password" type="password" placeholder="Your password"></div>
      <div id="authErr" class="errline" style="display:none;"></div>
      <button class="btn btn-primary" id="authSubmit">Log in</button>
      <div style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:12px;">New to Kitque? <a href="#" id="goSignup" style="color:var(--brand-dark);font-weight:700;">Create an account</a></div>
    `;
    document.getElementById('authSubmit').addEventListener('click', doLogin);
    document.getElementById('goSignup').addEventListener('click', (e)=>{ e.preventDefault(); authTab='signup'; renderAuthStage(); });
    document.getElementById('googleLoginBtn').addEventListener('click', ()=>signInWithGoogle('profile'));
  } else if(authTab === "signup"){
    wrap.innerHTML = `
      <div class="field"><label>Full name</label><input id="a_name" placeholder="Your name"></div>
      <div class="field"><label>Mobile number</label><input id="a_mobile" placeholder="10-digit number"></div>
      <div class="field"><label>Email</label><input id="a_email" placeholder="you@email.com"></div>
      <div class="field"><label>Password</label><input id="a_password" type="password" placeholder="At least 6 characters"></div>
      <div id="authErr" class="errline" style="display:none;"></div>
      <button class="btn btn-primary" id="authSubmit">Create account</button>
      <div style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:12px;">Already have an account? <a href="#" id="goLogin" style="color:var(--brand-dark);font-weight:700;">Log in</a></div>
    `;
    document.getElementById('authSubmit').addEventListener('click', doSignup);
    document.getElementById('goLogin').addEventListener('click', (e)=>{ e.preventDefault(); authTab='login'; renderAuthStage(); });
  }
}

async function doLogin(){
  const email = document.getElementById('a_email').value.trim();
  const password = document.getElementById('a_password').value;
  const err = document.getElementById('authErr');
  err.style.display='none';
  if(!email || !email.includes('@')){ err.style.display='block'; err.textContent="Enter a valid email address."; return; }
  if(!password){ err.style.display='block'; err.textContent="Enter your password."; return; }

  try{
    const data = await authFetch("token?grant_type=password", {email, password});
    session = { access_token: data.access_token, user: data.user };
    await fetchMyProfile();
    toast("Welcome back!");
    renderProfileTab();
  }catch(e){ err.style.display='block'; err.textContent = e.message; }
}

async function fetchMyProfile(){
  if(!session){ profile = null; return; }
  try{
    const rows = await pgFetch(`profiles?select=*&id=eq.${session.user.id}`);
    profile = (rows && rows[0]) ? rows[0] : null;
  }catch(e){ profile = null; }
}

/* ---------------- Google sign-in ---------------- */

function signInWithGoogle(landingTab){
  sessionStorage.setItem('kitque_oauth_landing', landingTab || 'profile');
  const redirectTo = window.location.origin + window.location.pathname;
  const url = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(redirectTo)}`;
  window.location.href = url;
}

async function handleOAuthRedirect(){
  if(!window.location.hash || !window.location.hash.includes('access_token')) return;
  const params = new URLSearchParams(window.location.hash.slice(1));
  const accessToken = params.get('access_token');
  if(!accessToken) return;

  // Clean the token out of the URL immediately so it isn't left sitting
  // in browser history / visible in the address bar.
  history.replaceState(null, '', window.location.pathname + window.location.search);

  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + accessToken }
    });
    const user = await res.json();
    if(!res.ok || !user.id) throw new Error("Couldn't complete Google sign-in.");

    session = { access_token: accessToken, user };
    const fullName = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || "";
    await pgFetch("profiles", {
      method:"POST", headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify({ id: user.id, name: fullName, email: user.email })
    });
    await fetchMyProfile();
    toast("Welcome, " + (fullName || user.email) + "!");

    sessionStorage.removeItem('kitque_oauth_landing');
    showTab('profile');
  }catch(e){
    console.error(e);
    toast("Google sign-in failed. Try again.");
  }
}

async function doSignup(){
  const name = document.getElementById('a_name').value.trim();
  const mobile = document.getElementById('a_mobile').value.trim();
  const email = document.getElementById('a_email').value.trim();
  const password = document.getElementById('a_password').value;
  const err = document.getElementById('authErr');
  err.style.display='none';
  if(!name || !/^\d{10}$/.test(mobile)){ err.style.display='block'; err.textContent="Enter your name and a valid 10-digit mobile number."; return; }
  if(!email || !email.includes('@')){ err.style.display='block'; err.textContent="Enter a valid email address."; return; }
  if(!password || password.length < 6){ err.style.display='block'; err.textContent="Password must be at least 6 characters."; return; }

  try{
    const data = await authFetch("signup", {email, password, data:{}});
    if(!data.access_token){
      // Project still has "Confirm email" turned on in Supabase — see note below.
      err.style.display='block';
      err.textContent = "Account created, but email confirmation is still required by the backend. Turn off \"Confirm email\" in Supabase Auth settings to skip verification.";
      return;
    }
    session = { access_token: data.access_token, user: data.user };
    await pgFetch("profiles", {method:"POST", headers:{"Prefer":"resolution=merge-duplicates"}, body: JSON.stringify({id: session.user.id, name, mobile, email})});
    await fetchMyProfile();
    toast("Account created!");
    renderProfileTab();
  }catch(e){ err.style.display='block'; err.textContent = e.message; }
}

/* ---------------- init ---------------- */
(async function init(){
  await handleOAuthRedirect();
  await loadSiteLogo();
  await loadCategories();
  await loadProducts();
  openSharedProductFromUrl();
})();
</script>
