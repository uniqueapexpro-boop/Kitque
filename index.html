<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kitque — everything for home, delivered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg:#F5F7F1;
    --card:#FFFFFF;
    --ink:#22261E;
    --ink-soft:#5C6154;
    --line:#E3E2D6;
    --brand:#1F4B3F;
    --brand-dark:#153328;
    --brand-tint:#E5EEE9;
    --accent:#E8A33D;
    --accent-dark:#8C5A16;
    --accent-tint:#FBEDD6;
    --danger:#B3432F;
    --danger-tint:#FBE9E4;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:82px;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:18px 18px 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brandmark{display:flex;align-items:center;gap:10px;}
  .logo-slot{
    width:160px;height:48px;overflow:hidden;visibility:hidden;flex-shrink:0;
  }
  .logo-slot.has-logo{visibility:visible;}
  .logo-slot img{width:100%;height:100%;object-fit:contain;object-position:left center;display:block;}
  .brandmark span{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--brand-dark);letter-spacing:-.01em;}
  .logo-slot.has-logo ~ span{display:none;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);}

  /* ---------- views ---------- */
  .view{padding:0 18px 24px;display:none;}
  .view.active{display:block;}
  .section-title{font-size:20px;margin:6px 0 14px;}

  /* ---------- search & filters ---------- */
  .searchbar{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:12px;
  }
  .searchbar input{
    border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--ink);
  }
  .searchbar svg{flex-shrink:0;opacity:.55;}
  .filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
  .chip{
    flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-soft);
    white-space:nowrap;
  }
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .filter-panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:14px;margin-bottom:16px;display:none;
  }
  .filter-panel.open{display:block;}
  .filter-panel label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .filter-panel input[type=range]{width:100%;}
  .filter-row{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--ink-soft);}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .pcard .thumb{
    width:100%;aspect-ratio:1/1;background:var(--brand-tint);
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
  }
  .pcard .thumb img{width:100%;height:100%;object-fit:cover;}
  .pcard .best{
    position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;
  }
  .pcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .pcard .title{font-size:13.5px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pcard .price{font-size:15px;font-weight:700;color:var(--brand-dark);margin-top:auto;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty .glyph{font-size:38px;margin-bottom:10px;}
  .empty h3{color:var(--ink);margin-bottom:6px;font-size:17px;}
  .empty p{font-size:13px;line-height:1.5;margin:0;}

  /* ---------- categories ---------- */
  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .catcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  }
  .catcard .icon{font-size:26px;}
  .catcard .name{font-weight:600;font-size:14px;}
  .catcard .count{font-size:11.5px;color:var(--ink-soft);}

  /* ---------- product view ---------- */
  .back-row{display:flex;align-items:center;gap:8px;padding:14px 18px 0;}
  .back-btn{
    border:1px solid var(--line);background:var(--card);border-radius:10px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  }
  .pv-image{width:100%;aspect-ratio:1/1;border-radius:var(--radius);background:var(--brand-tint);overflow:hidden;margin-bottom:16px;}
  .pv-image img{width:100%;height:100%;object-fit:cover;}

  /* ---------- product image gallery / slider ---------- */
  .pv-gallery{position:relative;margin-bottom:10px;}
  .pv-slider{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    border-radius:var(--radius);background:var(--brand-tint);
    scrollbar-width:none;
  }
  .pv-slider::-webkit-scrollbar{display:none;}
  .pv-slider .slide{
    flex:0 0 100%;aspect-ratio:1/1;scroll-snap-align:center;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .pv-slider .slide img{width:100%;height:100%;object-fit:cover;}
  .pv-dots{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  .pv-dots .dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s;}
  .pv-dots .dot.active{width:16px;border-radius:4px;background:var(--brand);}
  .pv-counter{
    position:absolute;top:10px;right:10px;background:rgba(34,38,30,.6);color:#fff;
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  }

  .pv-title{font-size:22px;margin-bottom:4px;}
  .pv-price{font-size:20px;font-weight:700;color:var(--brand-dark);margin-bottom:14px;}
  .pv-desc{font-size:14px;line-height:1.6;color:var(--ink-soft);margin-bottom:18px;}
  .pv-meta{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tag{background:var(--brand-tint);color:var(--brand-dark);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;}

  /* ---------- sticky product action bar ---------- */
  .pv-actionbar{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(65px + env(safe-area-inset-bottom));
    width:100%;max-width:480px;
    display:flex;gap:10px;align-items:center;
    padding:10px 18px;background:linear-gradient(to top,var(--bg) 60%,rgba(245,247,241,0));
    z-index:25;
  }
  .share-btn{
    width:48px;height:48px;flex-shrink:0;border-radius:var(--radius-sm);
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .pv-actionbar .btn{width:auto;flex:1;box-shadow:0 4px 14px rgba(21,51,40,.18);}
  .pv-spacer{height:70px;}

  /* ---------- modal / popup ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(21,24,17,.5);z-index:60;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-sheet{
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    background:var(--bg);border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(16px);transition:transform .2s;
  }
  .modal-overlay.open .modal-sheet{transform:translateY(0);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h3{font-size:17px;}
  .modal-close{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;
  }

  .btn{
    width:100%;padding:14px;border-radius:var(--radius-sm);border:none;
    font-size:15px;font-weight:700;text-align:center;
  }
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:active{background:var(--brand-dark);}
  .btn-ghost{background:var(--card);color:var(--brand-dark);border:1px solid var(--line);}
  .btn-danger{background:var(--danger-tint);color:var(--danger);border:1px solid #EBC6BB;}

  /* ---------- form ---------- */
  .form-wrap{margin-top:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 13px;border-radius:var(--radius-sm);border:1px solid var(--line);
    font-size:14px;background:var(--card);color:var(--ink);font-family:inherit;
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .cod-note{
    display:flex;gap:8px;align-items:center;background:var(--accent-tint);color:var(--accent-dark);
    padding:10px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;margin-bottom:14px;
  }
  .errline{color:var(--danger);font-size:12.5px;margin:-4px 0 10px;}

  /* ---------- order card ---------- */
  .ordercard{
    background:var(--card);border:1.5px dashed var(--brand);border-radius:var(--radius);
    padding:20px;margin-top:10px;
  }
  .ordercard .ok{display:flex;align-items:center;gap:8px;color:var(--brand-dark);font-weight:700;margin-bottom:12px;}
  .ordercard .code{
    background:var(--brand-tint);color:var(--brand-dark);font-family:'Fraunces',serif;
    font-size:20px;font-weight:600;text-align:center;padding:12px;border-radius:10px;margin-bottom:14px;letter-spacing:.03em;
  }
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .kv span:first-child{color:var(--ink-soft);}
  .kv span:last-child{font-weight:600;text-align:right;max-width:60%;}
  .track-note{
    margin-top:16px;background:var(--accent-tint);border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;color:var(--accent-dark);line-height:1.5;
  }

  /* ---------- my orders ---------- */
  .lookup-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
  .lookup-box h3{font-size:14px;margin-bottom:10px;}
  .ordertile{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
  }
  .ordertile .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .ordertile .code{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .status.Confirmed{background:var(--brand-tint);color:var(--brand-dark);}
  .status.Shipped{background:var(--accent-tint);color:var(--accent-dark);}
  .status.Delivered{background:#E1F0E1;color:#2C6B2C;}
  .status.Cancelled{background:var(--danger-tint);color:var(--danger);}
  .ordertile .pname{font-size:13.5px;margin-bottom:4px;}
  .ordertile .meta{font-size:12px;color:var(--ink-soft);}
  .ordertile .cancel-row{margin-top:10px;}
  .ordertile .cancel-row button{
    width:auto;padding:8px 14px;font-size:12.5px;
  }

  /* ---------- profile ---------- */
  .authcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .authtabs{display:flex;background:var(--brand-tint);border-radius:999px;padding:4px;margin-bottom:16px;}
  .authtabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:999px;font-size:13px;font-weight:700;color:var(--brand-dark);}
  .authtabs button.active{background:var(--brand);color:#fff;}
  .profile-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .profile-head .pname{font-size:16px;font-weight:700;}
  .profile-head .pmob{font-size:12.5px;color:var(--ink-soft);}
  .stat-row{display:flex;gap:10px;margin-bottom:18px;}
  .stat{flex:1;background:var(--brand-tint);border-radius:var(--radius-sm);padding:12px;text-align:center;}
  .stat .n{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--brand-dark);}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:var(--card);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;
    padding:9px 4px calc(9px + env(safe-area-inset-bottom));
    z-index:30;
  }
  .navitem{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;border:none;color:var(--ink-soft);font-size:10.5px;font-weight:600;
    padding:4px 6px;border-radius:10px;
  }
  .navitem svg{stroke:var(--ink-soft);}
  .navitem.active{color:var(--brand-dark);}
  .navitem.active svg{stroke:var(--brand-dark);}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;
    max-width:400px;text-align:center;z-index:50;
  }
  .toast.show{opacity:1;}

  .config-banner{
    background:var(--danger-tint);color:var(--danger);font-size:12px;padding:10px 14px;
    border-radius:var(--radius-sm);margin:14px 18px 0;line-height:1.5;
  }

  /* ---------- price (actual + cut price) ---------- */
  .price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .price-now{font-size:26px;font-weight:800;color:var(--accent-dark);}
  .price-mrp{font-size:15px;color:var(--ink-soft);text-decoration:line-through;}
  .price-off{font-size:11.5px;font-weight:700;color:#2C6B2C;background:#E1F0E1;padding:2px 8px;border-radius:999px;}
  .pcard .price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .pcard .price span:first-child{font-size:17px;font-weight:800;color:var(--accent-dark);}
  .pcard .price-mrp-sm{font-size:11px;color:var(--ink-soft);text-decoration:line-through;font-weight:500;}

  /* ---------- quantity stepper ---------- */
  .qty-stepper{display:flex;align-items:center;gap:12px;margin:2px 0 14px;}
  .qty-stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700;color:var(--brand-dark);display:flex;align-items:center;justify-content:center;line-height:1;}
  .qty-stepper .qn{font-size:16px;font-weight:700;min-width:22px;text-align:center;}
  .qty-stepper .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .total-row{font-size:13.5px;font-weight:700;color:var(--brand-dark);margin-left:auto;}

  /* ---------- size selector ---------- */
  .size-label{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;}
  .size-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .size-chip{padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--ink);}
  .size-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  @media print{
    body *{visibility:hidden;}
    #printarea,#printarea *{visibility:visible;}
    #printarea{position:absolute;top:0;left:0;width:100%;padding:24px;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brandmark">
      <div class="logo-slot" id="brandMark"></div>
      <span>Kitque</span>
    </div>
    <div class="sub" id="topbarSub">everything for home</div>
  </div>

  <div id="configBanner" class="config-banner" style="display:none;"></div>

  <!-- ================= ALL PRODUCTS ================= -->
  <div class="view active" id="view-products">
    <h2 class="section-title">All products</h2>
    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Search for a product…">
    </div>
    <div class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="bestseller">Best sellers</button>
      <button class="chip" data-filter="under500">Under ₹500</button>
      <button class="chip" data-filter="500to2000">₹500–₹2000</button>
      <button class="chip" data-filter="over2000">Over ₹2000</button>
    </div>
    <div id="productGrid" class="grid"></div>
  </div>

  <!-- ================= CATEGORY ================= -->
  <div class="view" id="view-category">
    <h2 class="section-title">Shop by category</h2>
    <div id="catGrid" class="catgrid"></div>
  </div>

  <!-- ================= PRODUCT VIEW ================= -->
  <div class="view" id="view-productview">
    <div id="pvContent"></div>
  </div>

  <div class="pv-actionbar" id="pvActionBar" style="display:none;">
    <button class="share-btn" id="shareBtn" aria-label="Share product">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
    </button>
    <button class="btn btn-primary" id="orderBtn">Order this product</button>
  </div>

  <!-- ================= MY ORDERS ================= -->
  <div class="view" id="view-orders">
    <h2 class="section-title">My orders</h2>
    <div id="ordersContent"></div>
  </div>

  <!-- ================= PROFILE ================= -->
  <div class="view" id="view-profile">
    <h2 class="section-title">Profile</h2>
    <div id="profileContent"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="bottomnav">
  <button class="navitem active" data-tab="products">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    All products
  </button>
  <button class="navitem" data-tab="orders">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18l-1.5 12.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5L3 7z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>
    My orders
  </button>
  <button class="navitem" data-tab="category">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="ro
